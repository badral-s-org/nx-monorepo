name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  ci-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Derive appropriate SHAs for Nx affected commands
        uses: nrwl/nx-set-shas@v4

      - name: Install Dependencies
        run: npm ci

      - name: Approve install scripts
        run: |
          npm install-scripts approve \
            @parcel/watcher \
            sharp \
            @swc/core \
            esbuild \
            less \
            nx \
            unrs-resolver

      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      - name: Run Affected Builds
        run: npx nx affected -t build

      - run: npx nx fix-ci
        if: always()

  deploy:
    runs-on: ubuntu-latest
    needs: ci-build

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Derive appropriate SHAs for Nx affected commands
        uses: nrwl/nx-set-shas@v4

      - name: Install Dependencies
        run: npm ci

      - name: Approve install scripts
        run: |
          npm install-scripts approve \
            @parcel/watcher \
            sharp \
            @swc/core \
            esbuild \
            less \
            nx \
            unrs-resolver

      - name: Verify client-only
        run: |
          echo "Checking client-only..."
          npm ls client-only
          test -f node_modules/client-only/index.js

      - name: Install Vercel CLI
        run: npm install -g vercel@59.13.1
      - name: Get affected projects
        run: |
          npx nx show projects --affected
      - name: Deploy Affected Projects to Vercel
        run: npx nx affected --target=deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
