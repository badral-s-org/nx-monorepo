name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  ci-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Derive appropriate SHAs for Nx affected commands
        uses: nrwl/nx-set-shas@v4

      - name: Install Dependencies
        run: npm ci

      - name: Approve install scripts
        run: |
          npm install-scripts approve \
            @parcel/watcher \
            sharp \
            @swc/core \
            esbuild \
            less \
            nx \
            unrs-resolver

      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      - name: Run Affected Builds
        run: npx nx affected -t build

      - run: npx nx fix-ci
        if: always()

  deploy:
    runs-on: ubuntu-latest

    needs: ci-build

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required by Nx to compare commits

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm' # Change to yarn or pnpm if applicable

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Derive SHAs for Nx affected
        uses: nrwl/nx-set-shas@v4

      - name: Deploy Affected Apps to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.SECRET_MANAGER_WEB }}
        # Runs a custom script or inline logic to deploy affected apps
        run: |
          npx nx affected --target=deploy --base=${{ env.NX_BASE }} --head=${{ env.NX_HEAD }}
