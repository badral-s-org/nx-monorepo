name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  ci-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Derive appropriate SHAs for Nx affected commands
        uses: nrwl/nx-set-shas@v4

      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Affected Builds
        run: npx nx affected -t build

      - run: npx nx fix-ci
        if: always()

  deploy:
    runs-on: ubuntu-latest
    needs: ci-build
    if: github.ref == 'refs/heads/main' # Зөвхөн main branch дээр push хийгдэхэд деплой ажиллана (Pull Request дээр ажиллахгүй)
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nx affected ажиллахад Git түүх заавал хэрэгтэй

      - name: Derive appropriate SHAs for Nx affected commands
        uses: nrwl/nx-set-shas@v4 # Git SHA харьцуулалтыг энд бас ажиллуулна

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci # Nxaffected ажиллуулахад багцууд суусан байх ёстой

      - name: Install Vercel CLI Globally
        run: npm install -g vercel

      - name: Deploy Affected Projects to Vercel
        run: npx nx affected --target=deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
