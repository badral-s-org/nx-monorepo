name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

env:
  # Secret group in secret-manager-service whose secrets are exported to the jobs.
  SECRET_GROUP: secret-manager-service

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and build secret-manager-service
        run: npx nx run-many -t lint typecheck build -p @org/secret-manager-service

  deploy:
    runs-on: ubuntu-latest

    needs: ci

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Load secrets from secret-manager-service
        id: secrets
        uses: ./.github/actions/load-secrets
        with:
          group: ${{ env.SECRET_GROUP }}
          service-url: ${{ vars.SECRET_MANAGER_SERVICE_URL || secrets.SECRET_MANAGER_SERVICE_URL }}
          api-key: ${{ secrets.GET_ENV_API_KEY }}

      # Migrations run first so the new code never sees an old schema.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN_SECRET_MANAGER_SERVICE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx nx run @org/secret-manager-service:db-migrate-prod

      # The group's secrets are uploaded to the worker as worker secrets.
      # CLOUDFLARE_* keys are only deploy credentials, so they are left out.
      # Secrets are applied additively: removing one from the group does not
      # delete it from the worker (use `wrangler secret delete`).
      - name: Deploy secret-manager-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN_SECRET_MANAGER_SERVICE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRETS_FILE: ${{ steps.secrets.outputs.secrets-file }}
        run: |
          worker_secrets="$RUNNER_TEMP/worker-secrets.json"
          (umask 077 && jq 'with_entries(select(.key | startswith("CLOUDFLARE_") | not))' "$SECRETS_FILE" > "$worker_secrets")
          npx nx run @org/secret-manager-service:deploy -- --secrets-file="$worker_secrets"
          rm -f "$worker_secrets" "$SECRETS_FILE"
